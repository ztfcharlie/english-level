server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # 就一个 190KB 的页面，gzip 之后大概四分之一。
    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/html text/plain text/css text/markdown
                    application/javascript application/json image/svg+xml;

    # 页面把整个数据集内嵌在里面，所以浏览器要是缓存了旧副本，会**不声不响地**
    # 继续用旧的视频链接。让它每次重新验证。
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # 不认识的路径也落到播放器上，而不是 404 —— 小朋友乱按地址栏不该撞进死胡同。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
